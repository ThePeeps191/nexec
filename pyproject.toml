[project]
name = "nexec"
version = "0.0.0"
description = "No-execute bits for LLM tokens: provenance-gated instruction-direction ablation"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.13",
    "transformers>=5.20,<5.21",
    "safetensors",
    "numpy",
    "matplotlib",
]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["spike/tests"]
