name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # macOS arm64: CPU-only torch wheels (Linux PyPI torch pulls multi-GB CUDA wheels)
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    env:
      # optional: with a token that has accepted the Llama-3.2 and Gemma-2 licenses, the gated-tokenizer tests run;
      # without it they are skipped. Model-weight tests (-m slow) never run in CI.
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: uv run ruff check .
      - run: uv run pytest -q -rs
      - run: uv build
